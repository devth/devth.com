name: Check static site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Cancel stale PR checks, but never interrupt an in-flight production release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Ships immediately on master. Checks and tests run alongside and never block a release.
  deploy:
    name: Deploy production
    if: >-
      github.repository == 'devth/devth.com' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://devth.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Publish production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the Production environment."
            exit 1
          fi
          start=$(date +%s%N)
          # The www redirect and the main site deploy in parallel.
          bunx wrangler deploy --config wrangler.www.jsonc & www=$!
          bunx wrangler deploy --config wrangler.production.jsonc
          wait "$www"
          elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
          printf '### Production deploy\n\n**%s ms** for www redirect, production build, asset upload, and activation.\n\n[devth.com](https://devth.com) · commit `%s`\n' "$elapsed" "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - run: bun run build:production

  browser:
    name: Browser + counter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (cold cache only)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
